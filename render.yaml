services:
  # --- NestJS API (Docker) ---------------------------------------------------
  # The Dockerfile installs with --legacy-peer-deps (.npmrc), runs
  # `prisma generate` (the generated client is gitignored, so a fresh clone does
  # not have it), then builds shared + api.
  - type: web
    name: matrimony-api
    env: docker
    region: singapore
    plan: free
    repoPath: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: API_GLOBAL_PREFIX
        value: api/v1
      - key: TZ
        value: UTC
      - key: DATABASE_URL
        valueType: secret
      - key: REDIS_URL
        valueType: secret
      - key: JWT_ACCESS_SECRET
        valueType: secret
      - key: JWT_REFRESH_SECRET
        valueType: secret
      - key: OTP_HASH_SECRET
        valueType: secret
      - key: MFA_ENCRYPTION_KEY
        valueType: secret
      - key: S3_ENDPOINT
        valueType: secret
      - key: S3_BUCKET
        valueType: secret
      - key: S3_ACCESS_KEY
        valueType: secret
      - key: S3_SECRET_KEY
        valueType: secret
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_SIGNED_URL_TTL
        value: "300"
      - key: ADMIN_API_BASE_URL
        value: "https://matrimony-api-2bmy.onrender.com/api/v1"
      - key: API_CORS_ORIGINS
        value: "https://matrimony-admin-o9o2.onrender.com"
      # Payment & notification secrets — add when ready
      # - key: RAZORPAY_KEY_ID
      #   valueType: secret
      # - key: RAZORPAY_KEY_SECRET
      #   valueType: secret
      # - key: RAZORPAY_WEBHOOK_SECRET
      #   valueType: secret
      # - key: CASHFREE_CLIENT_ID
      #   valueType: secret
      # - key: CASHFREE_CLIENT_SECRET
      #   valueType: secret
      # - key: FCM_SERVICE_ACCOUNT_JSON
      #   valueType: secret
      # - key: SMS_PROVIDER_API_KEY
      #   valueType: secret
      # - key: SMS_SENDER_ID
      #   valueType: secret
      # - key: SMS_TEMPLATE_ID
      #   valueType: secret
      # - key: SMS_DLT_ENTITY_ID
      #   valueType: secret
      # - key: SMS_DLT_TEMPLATE_ID
      #   valueType: secret
      # The OTP template's placeholder, and the dialling code. Neither is a
      # secret, and the first is the one SMS setting that can be wrong while
      # everything still looks right: MSG91 answers `success` and bills the send
      # when the variable name does not match the approved template, and the SMS
      # then arrives with the code's slot empty. Case-sensitive; it must match
      # the placeholder in the DLT-approved template (recorded as `var1`).
      - key: SMS_OTP_TEMPLATE_VAR
        value: var1
      - key: SMS_COUNTRY_CODE
        value: "91"
      # - key: EMAIL_PROVIDER_API_KEY
      #   valueType: secret
      # - key: EMAIL_FROM_ADDRESS
      #   valueType: secret
    healthCheckPath: /api/v1/health/ready
    healthCheckPort: 4000
    autoDeploy: true
    rootDirectory: .
    maxDuration: 60
    # Every commit used to rebuild and reboot the API, including changes to the
    # mobile app. That is slow, it restarts migrations for no reason, and two
    # deploys landing together collided on the migration advisory lock — a
    # mobile-only commit once showed up as a failed API deploy. Only rebuild for
    # what the image actually contains.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - prisma/**
        - Dockerfile
        - package.json
        - package-lock.json
        - .npmrc
        - tsconfig*.json
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"

  # --- Admin Dashboard (Next.js, Node runtime) -------------------------------
  # @matrimony/shared resolves to packages/shared/dist, so it is built first.
  # `next start` serves the normal build; there is no `output: 'standalone'` in
  # next.config.ts, so a standalone server.js does not exist.
  - type: web
    name: matrimony-admin
    env: node
    region: singapore
    plan: free
    runtime: node
    buildCommand: npm run build -w @matrimony/shared && npm run build -w @matrimony/admin
    startCommand: npm run start -w @matrimony/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_BASE_URL
        value: "https://matrimony-api-2bmy.onrender.com/api/v1"
    healthCheckPath: /login
    autoDeploy: true
    rootDirectory: .
    # Same reasoning as the API: the console is not rebuilt for a change to the
    # mobile app or the landing page.
    buildFilter:
      paths:
        - apps/admin/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - tsconfig*.json
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"

  # --- Landing Page ---------------------------------------------------------
  - type: web
    name: matrimony-landing
    env: node
    region: singapore
    plan: free
    runtime: node
    buildCommand: echo "no build"
    startCommand: node landing/server.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
    rootDirectory: .

  # --- Mobile App (Expo) ----------------------------------------------------
  # The mobile app is an Expo/React Native app. It is NOT deployed as a
  # Render web service. Standalone APKs are built by .github/workflows/android-build.yml.
  # Env vars needed for the app (set in EAS environment or app.json):
  #   EXPO_PUBLIC_API_BASE_URL = https://matrimony-api-2bmy.onrender.com/api/v1
