name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Expo SDK 52 / RN 0.76 are built and tested against JDK 17.
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # Accept all licenses non-interactively
          yes | sdkmanager --licenses > /dev/null 2>&1

          # Install required components (platforms, build-tools, NDK)
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;26.1.10909125" 2>&1 | tee /tmp/sdkmanager.log

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Build Android app
        env:
          EXPO_PUBLIC_API_BASE_URL: https://matrimony-api-2bmy.onrender.com/api/v1
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          # Without pipefail a failing gradle's exit status is masked by `tee`,
          # so the job and the upload both reported success while no APK existed.
          set -o pipefail

          cd apps/mobile

          # Prebuild native Android project
          npx expo prebuild --platform android --clean 2>&1 | tee /tmp/prebuild.log

          # Copy secure-store XML resource files (expo-secure-store plugin
          # adds references to these in AndroidManifest.xml but does not
          # generate the files themselves)
          mkdir -p android/app/src/main/res/xml
          cp resources/xml/secure_store_backup_rules.xml android/app/src/main/res/xml/
          cp resources/xml/secure_store_data_extraction_rules.xml android/app/src/main/res/xml/

          # Build debug APK (no signing required)
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log

          ls -la app/build/outputs/apk/debug/

      - name: Publish failure detail to the run summary
        if: failure()
        run: |
          {
            echo '## Build logs (tail)'
            echo '### prebuild'; tail -n 60 /tmp/prebuild.log 2>/dev/null || echo 'no prebuild log'
            echo '### gradle'; tail -n 120 /tmp/gradle.log 2>/dev/null || echo 'no gradle log'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrimony-app-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          # Fail loudly instead of reporting success with nothing uploaded.
          if-no-files-found: error
