name: Android App Bundle Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android app bundle
    # Pinned rather than ubuntu-latest: the Android SDK/NDK paths below and
    # the toolchain versions come from the runner image, and ubuntu-latest is
    # rolling over to Ubuntu 26. Pin the image the APK is known to build on.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Expo SDK 57 / RN 0.86 and the Gradle 9.3.1 wrapper it generates are
          # built and tested against JDK 17 (Gradle 9 raises the floor to 17).
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # Without pipefail a failed install is masked by `tee` and the step
          # reports success, so the failure reappears later as "Build Android
          # app" going red with nothing pointing at the SDK.
          set -o pipefail

          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # Accept all licenses non-interactively. `yes` is killed by SIGPIPE
          # when sdkmanager exits, which pipefail would report as a failure of
          # this line, so that outcome alone is allowed; a real licence failure
          # still stops the install below.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Install required components (platforms, build-tools, NDK).
          #
          # These are the versions React Native 0.86.3 compiles against, read
          # from its own `gradle/libs.versions.toml`: compileSdk/targetSdk 36,
          # buildTools 36.0.0, ndk 27.1.12297006. Installing 35 and NDK 26 here
          # is what made the gradle step fail after the SDK 57 upgrade, since
          # RN now targets Android 16.
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" 2>&1 | tee /tmp/sdkmanager.log

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Build Android app
        env:
          EXPO_PUBLIC_API_BASE_URL: https://matrimony-api-2bmy.onrender.com/api/v1
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          # Without pipefail a failing gradle's exit status is masked by `tee`,
          # so the job and the upload both reported success while no APK existed.
          set -o pipefail

          cd apps/mobile

          # Prebuild native Android project
          npx expo prebuild --platform android --clean 2>&1 | tee /tmp/prebuild.log

          # The two secure-store backup rule files that expo-secure-store's
          # plugin references from AndroidManifest.xml are written by
          # ./plugins/with-secure-store-backup-rules during the prebuild above,
          # so there is no copy step and nothing to patch in afterwards.

          # Build a release app bundle. Play has refused APKs for new apps
          # since August 2021, so the artifact this job produces has to be the
          # format that can actually be uploaded. A debug build embeds no JS
          # bundle (it loads from the Metro dev server); `bundleRelease` embeds
          # it exactly as `assembleRelease` did.
          #
          # The bundle is signed with the generated debug keystore, so this
          # proves the format, not submittability: Play wants an upload key and
          # Play App Signing, tracked in docs/ops/store-submission-requirements.md.
          cd android
          ./gradlew bundleRelease --no-daemon 2>&1 | tee /tmp/gradle.log

          ls -la app/build/outputs/bundle/release/

      - name: Check the AAB's targetSdk and versionCode
        run: |
          set -o pipefail

          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          BUNDLETOOL_VERSION=1.18.3

          # bundletool decodes the protobuf manifest stored inside the bundle, so
          # both values below come from the artifact Play would receive rather
          # than from app.json or the gradle files that produced it. The whole
          # manifest is dumped instead of using --xpath, which keeps this
          # independent of whatever namespace prefix bundletool prints.
          curl -fsSL -o /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base > /tmp/aab-manifest.xml

          target_sdk=$(grep -oE 'android:targetSdkVersion="[0-9]+"' /tmp/aab-manifest.xml | grep -oE '[0-9]+' | head -n1)
          version_code=$(grep -oE 'android:versionCode="[0-9]+"' /tmp/aab-manifest.xml | grep -oE '[0-9]+' | head -n1)
          expected_code=$(node -p "require('./apps/mobile/app.json').expo.android?.versionCode ?? 1")

          echo "AAB targetSdkVersion=${target_sdk:-<missing>}, versionCode=${version_code:-<missing>} (app.json asks for versionCode ${expected_code})"

          status=0

          # Play has refused new apps and updates below API 36 since 31 August
          # 2026, so the target is asserted exactly: raising it is a deliberate
          # edit here, in the gradle config and in this document.
          if [ "$target_sdk" != "36" ]; then
            echo "::error::The AAB targets API ${target_sdk:-<missing>}, not 36, which Play requires."
            status=1
          fi

          # A release with no ordered versionCode cannot be rolled forward, and
          # Play orders uploads by it, so a missing or unparseable value is a
          # failure rather than something to fix on the next release.
          if [ -z "$version_code" ] || [ "$version_code" -le 0 ]; then
            echo "::error::The AAB has versionCode '${version_code:-<missing>}', which is not a positive integer."
            status=1
          elif [ "$version_code" != "$expected_code" ]; then
            echo "::error::The AAB has versionCode ${version_code}, but apps/mobile/app.json asks for ${expected_code}."
            status=1
          fi

          exit $status

      - name: Publish failure detail to the run summary
        if: failure()
        run: |
          {
            echo '## Build logs (tail)'
            echo '### prebuild'; tail -n 60 /tmp/prebuild.log 2>/dev/null || echo 'no prebuild log'
            echo '### gradle'; tail -n 120 /tmp/gradle.log 2>/dev/null || echo 'no gradle log'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: matrimony-app-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          # Fail loudly instead of reporting success with nothing uploaded: an
          # AAB lands outside the apk/ tree, so a wrong task or output path is
          # easy to get wrong.
          if-no-files-found: error
