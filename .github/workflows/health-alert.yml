name: Health alert

# Polls the API's alert probe and raises a GitHub issue when a repair path has
# stopped, then closes it when the probe is healthy again. See
# docs/ops/alerting.md for why this runs here rather than on Render.

on:
  schedule:
    # Every half hour. A free Render web service sleeps after 15 idle minutes, so
    # each run pays the cold start and wakes the API only for the request; a
    # five-minute monitor would keep it permanently awake and spend the
    # workspace's 750 monthly instance hours on this service alone.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-alert
  cancel-in-progress: false

env:
  ALERT_URL: https://matrimony-api-2bmy.onrender.com/api/v1/health/alerts
  ALERT_LABEL: ops-alert

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-24.04
    steps:
      - name: Raise or clear the alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh takes the repository from a git remote or GH_REPO, and this job
          # never checks out. Without one, every gh call fails before it reaches
          # the API: six scheduled runs raised nothing and the label was never
          # created. GH_REPO is the documented substitute for a checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="$ALERT_URL"

          # A sleeping instance takes about a minute to wake and this request is
          # what wakes it, so the timeout has to cover a cold start rather than a
          # normal response time.
          status=$(curl --silent --show-error --location --max-time 120 \
            --output "$RUNNER_TEMP/alert.json" --write-out '%{http_code}' "$url") || status=000
          echo "GET $url -> HTTP $status"
          cat "$RUNNER_TEMP/alert.json" 2>/dev/null || true

          # Every gh call is part of the alert channel: one refused write loses
          # the alert, and a refused read cannot tell whether one is already open.
          # Say which call failed and what gh answered, instead of a bare red run.
          gh_refused() {
            local kind="$1" what="$2" code="$3" out="$4"
            echo "::error title=The alert channel refused a $kind::gh $what failed (exit $code): $out"
            echo "This probe cannot raise, clear or check an issue, so no alert reaches anyone."
            echo "Check that gh resolves the repository (GH_REPO or a checkout) and that"
            echo "the token may use issues (Settings > Actions > General > Workflow permissions)."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### The alert channel refused a %s\n\n`gh %s` failed with exit %s:\n\n```\n%s\n```\n\nNo issue can be raised, closed or checked until this is fixed.\n' \
                "$kind" "$what" "$code" "$out" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          }

          gh_write() {
            local what="$1" out code
            shift
            if out=$(gh "$@" 2>&1); then
              return 0
            else
              code=$?
            fi
            gh_refused write "$what" "$code" "$out"
          }

          # The value goes to a file rather than stdout, so that a refusal can
          # still print its diagnostic to this step's stdout: inside $(...) it
          # would be captured into the variable and never seen. stderr is kept
          # apart so a warning cannot be mistaken for the issue number.
          gh_read() {
            local what="$1" into="$2" code
            shift 2
            if gh "$@" >"$into" 2>"$RUNNER_TEMP/gh-read.err"; then
              return 0
            else
              code=$?
              gh_refused read "$what" "$code" "$(cat "$RUNNER_TEMP/gh-read.err")"
            fi
          }

          gh_write "create the $ALERT_LABEL label" label create "$ALERT_LABEL" --force --color B60205 \
            --description "A health check that repairs something has stopped"
          gh_read "list the open $ALERT_LABEL issue" "$RUNNER_TEMP/open.txt" \
            issue list --label "$ALERT_LABEL" --state open --json number \
            --jq '.[0].number // empty'
          open=$(cat "$RUNNER_TEMP/open.txt")

          if [ "$status" = 200 ]; then
            if [ -n "${open:-}" ]; then
              gh_write "close issue #$open" issue close "$open" --comment \
                "Recovered: \`$url\` answered 200 at $(date -u '+%Y-%m-%dT%H:%M:%SZ')."
            fi
            echo "probe healthy"
            exit 0
          fi

          if [ "$status" = 404 ]; then
            # The route is not deployed on this instance. That is a rollout
            # state, not a stopped repair path, and the release that carries it
            # cannot go out until the build quota resets. The route's existence
            # is pinned instead where it can be checked before a deploy: the
            # controller test asserts the path, and CI calls it on the built API.
            echo "alert route not deployed (HTTP 404); not alerting"
            exit 0
          fi

          if [ "$status" = 503 ] &&
            jq --exit-status '.down | length > 0' "$RUNNER_TEMP/alert.json" >/dev/null 2>&1; then
            detail=$(jq --raw-output '.down | join(", ")' "$RUNNER_TEMP/alert.json")
          else
            detail="the API did not answer its alert probe (HTTP $status)"
          fi

          if [ -n "${open:-}" ]; then
            # Already open: the issue is the alert. A comment every half hour is
            # how a real alert gets filtered out with the noise.
            echo "still down: $detail"
            exit 0
          fi

          gh_write "open an alert issue" issue create --label "$ALERT_LABEL" \
            --title "Repair path down: $detail" \
            --body "$(printf '`%s` reported **%s** at %s.\n\nRunbook: `docs/ops/alerting.md`.\n' \
              "$url" "$detail" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')")"
