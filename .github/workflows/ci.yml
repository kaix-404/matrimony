name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    # Pinned rather than ubuntu-latest, which is rolling over to Ubuntu 26.
    runs-on: ubuntu-24.04

    services:
      # A real database, so the migration and seed are executed rather than
      # merely typechecked. Both are the parts most likely to break on a schema
      # change, and neither needs a network beyond localhost.
      postgres:
        # Keep in step with infra/docker/docker-compose.yml so CI and local
        # development run the same engine.
        image: postgres:16
        env:
          POSTGRES_USER: matrimony
          POSTGRES_PASSWORD: matrimony_ci_password
          POSTGRES_DB: matrimony_ci
          POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrimony -d matrimony_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://matrimony:matrimony_ci_password@localhost:5432/matrimony_ci
      # Required by the env schema, which fails closed at boot. Throwaway
      # values: nothing in CI authenticates or signs anything.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-for-signing
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-for-signing
      # Encrypts admins' TOTP secrets; required by the env schema, which fails
      # closed. A throwaway value: no MFA secret is ever stored in CI.
      MFA_ENCRYPTION_KEY: ci-mfa-key-not-used-to-encrypt-anything
      # Peppers the OTP hash; required by the env schema, which fails closed.
      OTP_HASH_SECRET: ci-otp-pepper-not-used-for-hashing
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ci-bucket
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck, lint, test and build
        run: npm run typecheck && npm run lint && npm run test && npm run build

      # Bundle the mobile app for web to catch broken imports/routes.
      # Runs inside apps/mobile: the app declares its own Expo/React Native
      # dependencies and its entry (expo-router/entry), so the workspace root
      # no longer needs duplicate copies of those packages.
      #
      # NODE_ENV must not be "test" here, even though the rest of the job sets
      # it. babel-preset-expo's expo-router plugin deliberately skips inlining
      # EXPO_ROUTER_APP_ROOT when NODE_ENV === "test" (it is meant for unit
      # tests), which leaves `require.context(process.env.EXPO_ROUTER_APP_ROOT,
      # ...)` in expo-router/_ctx.web.js and breaks the web bundle with
      # "First argument of `require.context` should be a string".
      - name: Bundle the mobile app
        working-directory: apps/mobile
        env:
          NODE_ENV: production
          # Public, build-time values baked into the bundle. Committed here
          # because CI has no .env (it is gitignored).
          EXPO_PUBLIC_API_BASE_URL: https://matrimony-api-2bmy.onrender.com/api/v1
        run: npx expo export --platform web --output-dir dist

      # Catches schema/SQL drift that `prisma validate` cannot: validate only
      # parses the schema, it does not prove the SQL applies.
      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Seed reference data
        run: npm run prisma:seed

      # The seed asserts its own invariants (pricing totals, band coverage,
      # Super-Admin-only permissions), so a second run proves it is genuinely
      # idempotent rather than only working on an empty database.
      - name: Re-run seed to prove idempotency
        run: npm run prisma:seed

      - name: Start the API and check readiness
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          # API_GLOBAL_PREFIX defaults to api/v1 (see apps/api/src/config/env.ts).
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/api/v1/health/ready; then
              echo "readiness OK"
              kill "$API_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          kill "$API_PID" 2>/dev/null || true
          exit 1
